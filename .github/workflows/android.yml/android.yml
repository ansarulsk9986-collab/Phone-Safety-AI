name: Build Phone Safety AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        run: |
          unzip -q Phone_Safety_AI_Project.zip -d source
          APP_DIR=$(dirname "$(find source -name package.json | head -n 1)")
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Build app
        run: |
          cd "$APP_DIR"
          npm install
          npm run build
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Phone-Safety-AI-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
